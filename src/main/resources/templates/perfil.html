<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Mi Perfil</title>
    <link rel="stylesheet" href="/css/perfil.css">
    <link rel="shortcut icon" href="/imagenes/logo-website.png" type="image/x-icon">
    <script src="/js/perfil.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<h1>Perfil - Organic Food</h1>

<nav class="nav-container">
    <div class="user-info" th:if="${usuario != null}">
        <a th:href="@{/perfil}">
            <img id="nav-profile-pic"
                 th:src="${usuario.fotoPerfil != null} ? ${usuario.fotoPerfil} : '/imagenes/avatar-session.jpg'"
                 alt="Avatar" class="avatar-navbar">
        </a>
        <span id="nav-username" th:text="${usuario.nombreUsuario}">Federico Bitsch</span>
    </div>

    <div class="nav-links">
        <a th:href="@{/index}">Inicio</a>
        <a th:href="@{/contactoSoporte}">Soporte</a>
        <a th:href="@{/publicaciones}">Publicaciones</a>
        <a th:href="@{/productosOrganicos}">Productos Organicos</a>
        <a th:href="@{/blog}">Blog</a>

        <a th:href="@{/login}" sec:authorize="!isAuthenticated()" class="btn-login">Ingresar</a>

        <a th:href="@{/admin/dashboard}" sec:authorize="hasRole('ADMINISTRADOR')" class="admin-link">Panel Admin</a>

        <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" style="display:inline;">
            <button type="submit" class="btn-logout-nav">Cerrar Sesion</button>
        </form>
    </div>
</nav>
<div class="profile-card">
    <div class="profile-header">
        <div class="image-upload-container">
            <img id="profile-pic"
                 th:src="${usuario.fotoPerfil != null} ? ${usuario.fotoPerfil} : '/imagenes/avatar-session.jpg'"
                 alt="Foto de perfil">
            <label for="profile-image" class="btn-change-photo">Cambiar Foto</label>
            <input type="file" id="profile-image" name="profilePic" accept="image/*" onchange="previewImage(event)" style="display:none;">
        </div>
        <h2 th:text="${usuario.nombreUsuario}">Nombre de Usuario</h2>
        <span class="badge" th:text="${usuario.role}">ROL</span>
    </div>

    <div class="profile-form">
        <div class="input-group">
            <label>Rol de Usuario:</label>
            <input type="text" id="role" th:value="${usuario.role}" readonly class="readonly-input">
        </div>

        <div class="input-group">
            <label>Miembro desde:</label>
            <input type="text" id="register-date" th:value="${usuario.fechaRegistro}" readonly class="readonly-input">
        </div>

        <div class="input-group">
            <label>Correo Electrónico:</label>
            <input type="email" id="email" th:value="${usuario.email}" readonly class="readonly-input">
        </div>

        <div class="input-group">
            <label>Nombre:</label>
            <input type="text" id="username" th:value="${usuario.nombreUsuario}" required>
        </div>

        <div class="input-group">
            <label>Biografía:</label>
            <textarea id="bio" th:text="${usuario.bio}" placeholder="Cuéntanos algo sobre ti..."></textarea>
        </div>

        <button type="button" onclick="guardarPerfil()" class="btn-save">Guardar Cambios</button>
    </div>
</div>


<footer class="main-footer">
    <div class="footer-content">
        <p>&copy; 2026 <strong>Organic Food</strong>. Todos los derechos reservados</p>
        <p>Desarrollado por <strong>Federico Bitsch</strong> | DARKOR TECH Solutions</p>
    </div>
</footer>

</body>
</html>
