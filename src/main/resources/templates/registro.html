<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - Organic-Food</title>
    <link rel="shortcut icon" href="/imagenes/logo-website.png" type="image/x-icon">
    <link rel="stylesheet" href="/css/registro.css">

</head>
<body>
<div class="form-container">
    <h1>Registro</h1>

    <div th:if="${error}" class="mensaje-error" th:text="${error}"></div>

    <form action="/register" method="post" th:object="${usuario}">
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" th:field="*{email}" required /><br/>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" th:field="*{password}" required /><br/>

        <button type="submit">Registrar</button>
    </form>

    <a href="/login">¿Ya tienes cuenta? Inicia sesión aquí.</a>
    <a href="/contactoSoporte">
        <button type="button">Ir a Contacto-Soporte</button>
    </a>

    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            const pass = document.querySelector('input[name="password"]').value;
            const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;
            if (!regex.test(pass)) {
                e.preventDefault();
                alert("La contraseña debe tener 8 caracteres, una mayúscula y un número.");
            }
        });
    </script>

</div>
</body>
</html>
